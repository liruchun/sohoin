services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sohoin
      POSTGRES_USER: sohoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sohoin -d sohoin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
